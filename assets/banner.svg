<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#0a0d18;overflow:hidden;border-radius:12px;">
  <defs>
    <!-- Background Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(0.9) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(-50px) translateX(0px); opacity: 0.1; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .data-flow {
      stroke-dasharray: 8, 8;
      animation: dashFlow 2s linear infinite;
    }
    .data-flow-rev {
      stroke-dasharray: 6, 6;
      animation: dashFlow 3s linear infinite reverse;
    }
    .p1 { animation: floatParticle 5s ease-in-out infinite; }
    .p2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .p3 { animation: floatParticle 6s ease-in-out infinite 3s; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <circle class="orb-1" cx="220" cy="120" r="180" fill="#0284c7" filter="url(#softGlow)"/>
  <circle class="orb-2" cx="980" cy="280" r="220" fill="#7c3aed" filter="url(#softGlow)"/>
  <circle cx="600" cy="380" r="160" fill="#0d9488" filter="url(#softGlow)" opacity="0.25"/>

  <!-- Dynamic Animated Circuit / Flow Lines (Background layer) -->
  <g opacity="0.45">
    <path d="M 50 80 Q 300 20 600 80 T 1150 60" fill="none" stroke="#38bdf8" stroke-width="2" class="data-flow"/>
    <path d="M 50 360 Q 350 400 650 350 T 1150 370" fill="none" stroke="#a855f7" stroke-width="2" class="data-flow-rev"/>
    <path d="M 100 210 C 350 290 850 130 1100 210" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4, 12" class="data-flow"/>
  </g>

  <!-- Animated Floating Data Nodes -->
  <circle class="p1" cx="280" cy="260" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="p2" cx="720" cy="140" r="4" fill="#c084fc" filter="url(#glow)"/>
  <circle class="p3" cx="920" cy="220" r="3" fill="#34d399" filter="url(#glow)"/>
  <circle class="p1" cx="450" cy="90" r="3" fill="#818cf8" filter="url(#glow)"/>

  <!-- Foreground Backdrop Panel for Pristine Readability -->
  <rect x="100" y="45" width="1000" height="330" rx="20" fill="rgba(15, 23, 42, 0.72)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Foreground Content (Solid, Crisp, Unobscured) -->
  <g text-anchor="middle">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 95)">
      <rect x="-185" y="-18" width="370" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">
        ENTERPRISE INFRASTRUCTURE &amp; CLOUD APIS
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Awesome Cloud Backup REST API Gateway
    </text>

    <!-- Subtitle -->
    <text x="600" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
      Curated Ecosystem for API Traffic Routing, Multi-Tenant Resiliency &amp; Backup Orchestration
    </text>

    <!-- Feature Attribute Badges / Pills -->
    <g transform="translate(600, 280)">
      <!-- Pill 1 -->
      <g transform="translate(-330, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <circle cx="-68" cy="0" r="4.5" fill="#38bdf8"/>
        <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">SaaS &amp; OSS Gateways</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-110, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <circle cx="-70" cy="0" r="4.5" fill="#818cf8"/>
        <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">Transparent Pricing</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(110, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <circle cx="-68" cy="0" r="4.5" fill="#c084fc"/>
        <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">Zero-Trust Auth</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(330, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <circle cx="-72" cy="0" r="4.5" fill="#34d399"/>
        <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">Star-Ranked OSS</text>
      </g>
    </g>

    <!-- Footer Tagline inside banner -->
    <text x="600" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      🚀 Designed for Platform Engineers, Backup Architects &amp; Cloud Developers
    </text>
  </g>
</svg>